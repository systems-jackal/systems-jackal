<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="172"
     viewBox="0 0 800 172"
     role="img"
     aria-label="Knowledge is the one exploit that never gets patched. Amor Fati. Linux, networking, Python, Rust, Bash.">

  <defs>

    <!-- Original dark parchment palette -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1713"/>
      <stop offset="1" stop-color="#120f0c"/>
    </linearGradient>

    <!-- Subtle arcane texture -->
    <pattern id="dots"
             width="20"
             height="20"
             patternUnits="userSpaceOnUse">
      <circle
        cx="1"
        cy="1"
        r="0.9"
        fill="#b8935a"
        opacity="0.10"/>
    </pattern>

  </defs>

  <!-- Background -->
  <rect
    width="800"
    height="172"
    rx="6"
    fill="url(#bg)"/>

  <!-- Texture -->
  <rect
    width="800"
    height="172"
    rx="6"
    fill="url(#dots)"/>

  <!-- Outer frame -->
  <rect
    x="0.5"
    y="0.5"
    width="799"
    height="171"
    rx="6"
    fill="none"
    stroke="#3a3027"/>

  <!-- Inner frame -->
  <rect
    x="7.5"
    y="7.5"
    width="785"
    height="157"
    rx="4"
    fill="none"
    stroke="#2b241d"/>

  <!-- Decorative upper divider -->
  <line
    x1="84"
    y1="36"
    x2="384"
    y2="36"
    stroke="#8a6d42"
    stroke-width="1"/>

  <line
    x1="416"
    y1="36"
    x2="716"
    y2="36"
    stroke="#8a6d42"
    stroke-width="1"/>

  <!-- Central arcane glyph -->
  <polygon
    points="
      405.2,39
      400,42
      394.8,39
      394.8,33
      400,30
      405.2,33
    "
    fill="#14110e"
    stroke="#b8935a"
    stroke-width="1.3"/>

  <!-- Main slogan -->
  <text
    x="400"
    y="78"
    font-family="Georgia, Times New Roman, Times, serif"
    font-size="21"
    fill="#e8dfcc"
    text-anchor="middle"
    font-weight="normal"
    font-style="italic">
    Knowledge is the one exploit that never gets patched.
  </text>

  <!-- Secondary motto -->
  <text
    x="400"
    y="106"
    font-family="Georgia, Times New Roman, Times, serif"
    font-size="12"
    fill="#b8935a"
    text-anchor="middle"
    letter-spacing="5"
    font-weight="normal"
    font-style="italic">
    AMOR FATI
  </text>

  <!-- Technical signature -->
  <text
    x="400"
    y="134"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace"
    font-size="10"
    fill="#857a67"
    text-anchor="middle"
    letter-spacing="3">
    LINUX · NETWORKING · PYTHON · RUST · BASH
  </text>

  <!-- Bottom accent -->
  <line
    x1="250"
    y1="150"
    x2="550"
    y2="150"
    stroke="#8a6d42"
    stroke-width="1"
    opacity="0.55"/>

</svg>
